name: renovate

on:
  schedule:
    # Mondays at 05:00 UTC (06:00 or 07:00 in Paris), so the week's PRs are open by the start of the day.
    - cron: "0 5 * * 1"
  # Also from the Actions tab, for instance after ticking a box of the Dependency Dashboard issue.
  workflow_dispatch:
    inputs:
      log-level:
        description: "Renovate log level"
        type: choice
        options: [info, debug]
        default: info

# Renovate acts through RENOVATE_TOKEN, not through the workflow token.
permissions:
  contents: read

# A manual run waits for the scheduled one instead of racing it on the same branches.
concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      # Renovate clones the repository itself and reads its configuration from .github/renovate.json5.
      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          renovate-version: 44.233.0
          # A fine-grained token on this repository, read and write on contents, pull requests, issues (the
          # Dependency Dashboard), commit statuses (the release age check) and workflows. The workflow token
          # cannot update workflow files, and the PRs it opened would not trigger workflows.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
