# release-please keeps a release PR open from the conventional commits on main; merging it
# updates CHANGELOG.md, tags vX.Y.Z and publishes the GitHub Release. Config:
# release-please-config.json.
#
# The images workflow calls it once it has published main, so the release commit's signed
# sha-<short> images exist when the promote job tags them X.Y.Z. A tag pushed with the workflow
# token triggers no other workflow, so promotion lives here rather than on a tag event.
name: release

on:
  workflow_call:

permissions: {}

env:
  KO_DOCKER_REPO: ghcr.io/pdemagny
  # Promote only images signed by the images workflow on main.
  SIGNER_IDENTITY: https://github.com/pdemagny/metrik/.github/workflows/images.yaml@refs/heads/main
  SIGNER_ISSUER: https://token.actions.githubusercontent.com
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  release-please:
    runs-on: ubuntu-26.04
    concurrency:
      group: release
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  # Tag the signed sha-<short> images of the release commit X.Y.Z, no rebuild.
  promote:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [metrik, demo-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: cosign crane
          cache: true
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${TOKEN}" | crane auth login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Promote
        env:
          APP: ${{ matrix.app }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          repo="${KO_DOCKER_REPO}/${APP}"
          source="${repo}:sha-${SHA::7}"
          if ! digest=$(crane digest "${source}"); then
            echo "::error::image ${source} not found: the images run of ${SHA} did not publish it"
            exit 1
          fi
          cosign verify --certificate-identity "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "${SIGNER_ISSUER}" "${repo}@${digest}" > /dev/null
          crane tag "${repo}@${digest}" "${TAG#v}"
