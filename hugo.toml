baseURL = "https://pdemagny.github.io/metrik/"
title = "Metrik"
locale = "en"
disableKinds = ["taxonomy", "term", "RSS"]

# README.md and docs/ are the single source: mounted, never copied.
[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"
  [[module.mounts]]
    source = "README.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "docs"
    target = "content/docs"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = false

[markup.highlight]
  noClasses = false

[params]
  BookTheme = "auto"
  BookSection = "docs"
  BookRepo = "https://github.com/pdemagny/metrik"
  BookEditPath = "edit/main"
  BookSearch = true

[markup.goldmark.renderHooks.link]
  useEmbedded = "always"
