[tools]
air = "1.67.4"
cosign = "3.1.3"
crane = "0.22.1"
go = "1.27.1"
golangci-lint = "2.14.0"
helm = "4.3.0"
hugo-extended = "0.167.0"
kind = "0.33.0"
ko = "0.19.1"
kubectl = "1.37.1"
kubectx = "0.11.0"
pulumi = "3.267.0"
"pypi:specify-cli" = "1.2.5"
skaffold = "2.25.0"

[settings]
jobs = 4

[tasks.lint]
description = "Lint every Go module, or those in $MODULES (without golangci-lint's auto-fix)"
run = '''
status=0
for m in ${MODULES:-apps/demo-api apps/metrik pulumi}; do
  echo "==> $m"
  (cd "$m" && golangci-lint run --fix=false ./...) || status=1
done
exit $status
'''

[tasks.test]
description = "Run the Go tests of every module, or those in $MODULES, with the race detector"
env = { CGO_ENABLED = "1" }
run = '''
status=0
for m in ${MODULES:-apps/demo-api apps/metrik pulumi}; do
  echo "==> $m"
  # Only packages with tests: ./... would also build every untested package (in pulumi, the
  # whole Kubernetes SDK) with -race, which lint already type-checks.
  (cd "$m" && go test -race -count=1 $(go list -f '{% raw %}{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}{% endraw %}' ./...)) || status=1
done
exit $status
'''

[tasks.docs]
description = "Build the documentation website into public/"
run = "hugo --gc --minify"

[tasks."docs:serve"]
description = "Serve the documentation website with live reload"
run = "hugo server"
