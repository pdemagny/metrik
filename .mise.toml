[tools]
air = "1.67.4"
dive = "0.13.1"
go = "1.27.1"
golangci-lint = "2.14.0"
helm = "4.3.0"
hugo-extended = "0.167.0"
k9s = "0.51.0"
kind = "0.33.0"
ko = "0.19.1"
kubectl = "1.37.1"
kubectx = "0.11.0"
lazydocker = "0.25.2"
pulumi = "3.267.0"
"pypi:specify-cli" = "1.0.13"
skaffold = "2.25.0"

[settings]
jobs = 4

[tasks.lint]
description = "Lint every Go module (without golangci-lint's auto-fix)"
run = '''
status=0
for m in apps/api apps/metrik pulumi; do
  echo "==> $m"
  (cd "$m" && golangci-lint run --fix=false ./...) || status=1
done
exit $status
'''

[tasks.test]
description = "Run the Go tests of every module with the race detector"
env = { CGO_ENABLED = "1" }
run = '''
status=0
for m in apps/api apps/metrik pulumi; do
  echo "==> $m"
  (cd "$m" && go test -race -count=1 ./...) || status=1
done
exit $status
'''

[tasks.docs]
description = "Build the documentation website into public/"
run = "hugo --gc --minify"

[tasks."docs:serve"]
description = "Serve the documentation website with live reload"
run = "hugo server"
