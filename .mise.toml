[tools]
air = "1.67.4"
dive = "0.13.1"
go = "1.27.1"
golangci-lint = "2.14.0"
helm = "4.3.0"
k9s = "0.51.0"
ko = "0.19.1"
kubectl = "1.37.1"
kubectx = "0.11.0"
lazydocker = "0.25.2"
minikube = "1.39.0"
pulumi = "3.266.0"
skaffold = "2.25.0"

[settings]
jobs = 4

[tasks.lint]
description = "Lint every Go module (without golangci-lint's auto-fix)"
run = '''
status=0
for m in apps/api apps/metrik pulumi; do
  echo "==> $m"
  (cd "$m" && golangci-lint run --fix=false ./...) || status=1
done
exit $status
'''

[tasks.test]
description = "Run the Go tests of every module with the race detector"
env = { CGO_ENABLED = "1" }
run = '''
status=0
for m in apps/api apps/metrik pulumi; do
  echo "==> $m"
  (cd "$m" && go test -race -count=1 ./...) || status=1
done
exit $status
'''
