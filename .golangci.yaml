version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true

linters:
  default: none
  enable:
    - bodyclose # checks whether HTTP response body is closed successfully
    - gocheckcompilerdirectives # Checks Go compiler directives syntax
    - govet # Vet examines Go source code and reports suspicious constructs, such as Printf calls whose arguments do not align with the format string
    - ineffassign # Detects when assignments to existing variables are not used
    - misspell # Finds commonly misspelled English words in comments
    - perfsprint # replace uses of fmt.Sprintf and fmt.Errorf with better (both in CPU and memory) alternatives
    - unconvert # Remove unnecessary type conversions
    - unused # Checks Go code for unused constants, variables, functions and types
    - asasalint # Check for pass []any as any in variadic func(...any).
    - asciicheck # I prefer plane ASCII identifiers. Symbol `∆` instead of `delta` looks cool but no thanks.
    - bidichk # Checks for dangerous unicode character sequences. Super rare but why not to be a bit paranoid?
    - contextcheck # Check whether the function uses a non-inherited context.
    - durationcheck # Check for two durations multiplied together.
    - errcheck # Forces to not skip error check.
    - errname # Checks `Err-` prefix for var and `-Error` suffix for error type.
    - errorlint # Suggests to use `%w` for error-wrapping.
    - gocritic # Highly extensible Go source code linter providing checks currently missing from other linters.
    - godot # Forces to put `.` at the end of the comment. Code is poetry.
    - gomoddirectives # Allow or ban replace directives in go.mod or force explanation for retract directives.
    - gosec # Powerful security-oriented linter. But requires some time to configure it properly, see https://github.com/securego/gosec#available-rules
    - nakedret # Finds naked/bare returns and requires change them.
    - nilerr # require a bit more explicit returns.
    - nilnil # require a bit more explicit returns.
    - noctx # Finds sending HTTP request without context.Context.
    - nolintlint # Better not to have //nolint: at all ;)
    # - prealloc # Finds slices that could potentially be pre-allocated. Small performance win + cleaner code.
    - predeclared # Finds shadowing of Go's predeclared identifiers.
    - promlinter # Lint your Prometheus metrics name.
    - reassign # Checks that package variables are not reassigned.
    - revive # Drop-in replacement of `golint`.
    - rowserrcheck # Somewhat similar to `bodyclose` but for `database/sql` package.
    - sqlclosecheck # Somewhat similar to `bodyclose` but for `database/sql` package.
    - staticcheck # I have found that it's not the same as staticcheck binary :\
    - tagliatelle # Check struct tags.
    - testableexamples # Test-related checks. All of them are good.
    - thelper # Test-related checks. All of them are good.
    - tparallel # Test-related checks. All of them are good.
    - unparam # Might be noisy but better to know what is unused
    - usestdlibvars # Detect the possibility to use variables/constants from stdlib.
    - wastedassign # Finds wasted assignment statements.
    - decorder # Check declaration order of types, consts, vars and funcs.
    - depguard # Checks if package imports are in a list of acceptable packages.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    gosec:
      excludes:
        - G101 # Look for hardcoded credentials
        - G404 # math/rand is not cryptographically secure
        - G117 # Potential exposure of secrets via JSON marshaling
    revive:
      max-open-files: 2048
      enable-all-rules: false
      enable-default-rules: true
      rules:
        # https://github.com/mgechev/revive/blob/HEAD/RULES_DESCRIPTIONS.md#unexported-return
        - name: unexported-return
          severity: warning
          disabled: true
          exclude: [""]
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - math/rand
            - github.com/gin-contrib/zap
            - github.com/gin-gonic/gin
            - github.com/wI2L/fizz
            - github.com/wI2L/fizz/openapi
            - github.com/loopfz/gadgeto/tonic
            - github.com/pulumi
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/spf13/viper
            - github.com/cenkalti/backoff/v5
            - github.com/fsnotify/fsnotify
            - github.com/kr/pretty
            - go.uber.org/zap
            - metrik/cmd
            - metrik/pkg
            - metrik/internal
            - api/internal
            - pulumi/internal/utils
            - pulumi/pkg/helm/release
          deny:
            - pkg: "math/rand$"
              desc: use math/rand/v2
            - pkg: "github.com/sirupsen/logrus"
              desc: not allowed
            - pkg: "github.com/pkg/errors"
              desc: Should be replaced by standard lib errors package
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1003"
        - "-ST1016"
        - "-ST1020"
        - "-ST1021"
        - "-ST1022"
        - "-SA4010"
        - "-S1008"
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeExprCopy
        - rangeValCopy
    errcheck:
      check-type-assertions: true # Report `a := b.(MyStruct)` when `a, ok := ...` should be.
      check-blank: true # Report skipped checks:`num, _ := strconv.Atoi(numStr)`.
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
        - (*go.uber.org/zap.Logger).Sync # Syncing stdout returns EINVAL/ENOTTY; nothing to act on.
    govet:
      disable:
        - fieldalignment # I'm ok to waste some bytes
    nakedret: # No naked returns, ever.
      max-func-lines: 1 # Default: 30
    tagliatelle:
      case:
        rules:
          json: camel # why it's not a `snake` by default?!
          yaml: camel # why it's not a `snake` by default?!
          xml: camel
          bson: camel
          avro: snake
          mapstructure: kebab

run:
  allow-parallel-runners: true
  concurrency: 2

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
