apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: metrik
profiles:
  - name: dev
    requiresAllActivations: true
    activation:
      - kubeContext: kind-dev
        command: dev
    build:
      artifacts:
        - image: api
          context: apps/api
          ko:
            main: ./cmd/api
        - image: metrik
          context: apps/metrik
          ko:
            main: ./cmd/metrik
    deploy:
      helm:
        releases:
          - name: dev-api
            namespace: dev-api
            createNamespace: true
            chartPath: apps/api/deploy/chart/api
            valuesFiles:
              - apps/api/configs/dev-values.yaml
            version: 0.1.0
            setValueTemplates:
              image.repository: "{{.IMAGE_REPO_api}}"
              image.tag: "{{.IMAGE_TAG_api}}@{{.IMAGE_DIGEST_api}}"
          - name: dev-metrik
            namespace: dev-metrik
            createNamespace: true
            chartPath: apps/metrik/deploy/chart/metrik
            valuesFiles:
              - apps/metrik/configs/dev-values.yaml
            version: 0.1.0
            setValueTemplates:
              image.repository: "{{.IMAGE_REPO_metrik}}"
              image.tag: "{{.IMAGE_TAG_metrik}}@{{.IMAGE_DIGEST_metrik}}"
