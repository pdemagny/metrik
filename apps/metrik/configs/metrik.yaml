verbose: true
debug: false
runInterval: "10s"
maxConcurrent: 10
requestTimeout: "5s"
alertThreshold: "3s"
maxTries: 3 # total attempts per check; 0 is treated as 1 so retries stay bounded.
checks:
  # - name: "liveness ok" # should always pass.
  #   endpoint: "http://localhost:8080/v1/.well-known/live"
  # - name: "liveness slow timeout" # should randomly timeout, with a retry mecanism. If the retries timeouts too, it will log an error and send out an alert.
  #   endpoint: "http://localhost:8080/v1/slow"
  #   requestTimeout: "1s"
  - name: "liveness slow warn" # should randomly be slow, and warn if it is.
    endpoint: "http://localhost:8080/v1/slow"
    alertThreshold: "3s"
  - name: "liveness not found" # should fail with an alert on client error but not retry.
    endpoint: "http://localhost:8080/v1/.well-known/notfound"
  - name: "liveness connection refused" # should fail, retry and send out an alert.
  #   endpoint: "http://localhost:8081/v1/.well-known/live"
  #   maxTries: 5
  # - name: "readiness flaky" # should randomly give a 200 or a 503 depending on an optional application status parsed from the response body.
  #   endpoint: "http://localhost:8080/v1/.well-known/ready"
